server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 100MB
    max-swallow-size: 100MB

spring:
  application:
    name: ai-novel-system

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2MB

  # MySQL配置
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:moyun_novel_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5


  data:
    # MongoDB配置
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:moyun_novel_system}
      # MongoDB索引自动创建
      auto-index-creation: true



    # Redis配置
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

# MyBatis-Plus配置（用于用户模块）
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.novel.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# LLM配置（全部由用户在前端配置）
# 不再使用默认配置，所有模型配置存储在数据库 llm_config 表中

# Redis Stack向量数据库配置
redis-stack:
  vector:
    index-name: novel_summary_idx
    dimension: 1024
    distance-metric: cosine

# 生成配置
jwt:
  # 必须配置！至少32字节的随机密钥，不可使用默认值
  # 生成方式: openssl rand -base64 48
  secret: ${JWT_SECRET:changeme_generate_with_openssl_rand_base64_48}
  expiration: 86400000

generation:
  max-retry-count: 3
  chapter-word-count-min: 1000
  chapter-word-count-max: 1500
  outline-word-count-max: 500
  summary-word-count-max: 300

logging:
  level:
    com.novel.system: INFO
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ===== 作者Agent配置 =====
moyun:
  agent:
    author:
      enabled: true
      checkpoints:
        - outline
        - writing
        - audit_router
      max-interventions: 3
      pre-filter-enabled: true
      word-count-min: 1000
      word-count-max: 8000
      quality-score-auto-approve: 90.0

# ===== 加权校验配置 =====
novel:
  validation:
    use-graded-audit: false  # 默认走老逻辑，验证后切换为 true
    pass-threshold: 60.0
    dimensions:
      ooc:         { weight: 0.20, severity: FATAL }
      logic:       { weight: 0.20, severity: FATAL }
      setting:     { weight: 0.15, severity: FATAL }
      clue:        { weight: 0.15, severity: WARNING }
      rhythm:      { weight: 0.10, severity: WARNING }
      quality:     { weight: 0.10, severity: WARNING }
      clue-landing: { weight: 0.10, severity: WARNING }
  checkpoint:
    enabled: true

# ===== MCP 集成配置 =====
mcp:
  client:
    enabled: ${MCP_CLIENT_ENABLED:false}
    servers:
      memory:
        enabled: false
        transport: stdio
        command: npx
        args:
          - "-y"
          - "@modelcontextprotocol/server-memory"
        startup-timeout: 30
        required: false
      filesystem:
        enabled: false
        transport: stdio
        command: npx
        args:
          - "-y"
          - "@modelcontextprotocol/server-filesystem"
          - "${NOVEL_EXPORT_PATH:/tmp/moyun-exports}"
        startup-timeout: 30
        required: false
      novel-workflow:
        enabled: false
        transport: stdio
        command: npx
        args:
          - "-y"
          - "@ttaqt/novel-workflow-mcp@latest"
          - "${NOVEL_PROJECT_PATH:/tmp/moyun-novels}"
        startup-timeout: 60
        required: false
      brave-search:
        enabled: false
        transport: stdio
        command: npx
        args:
          - "-y"
          - "@modelcontextprotocol/server-brave-search"
        env:
          BRAVE_API_KEY: "${BRAVE_API_KEY:}"
        startup-timeout: 30
        required: false
  server:
    enabled: ${MCP_SERVER_ENABLED:false}
    name: moyun-novel-mcp-server
    version: 1.0.0
    transport: sse
    sse-endpoint: /mcp/sse
    auth:
      enabled: ${MCP_SERVER_AUTH_ENABLED:false}
      type: api-key
      keys: []

# ===== 类型指南配置 =====
genre:
  guide:
    max-chars-per-file: 2000
    max-total-chars: 8000
