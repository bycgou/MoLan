spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://mysql:3306/aibook?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: aibook
    password: aibook
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Redis配置
  redis:
    host: redis
    port: 6379
    password: 
    database: 0
  
  # RabbitMQ配置
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  
  # MongoDB配置
  data:
    mongodb:
      uri: mongodb://root:root@mongodb:27017/aibook?authSource=admin
  
  # 消息转换器
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# 日志配置
logging:
  level:
    root: info
    com.novel: debug

# 自定义配置
novel:
  # 章节生成配置
  chapter:
    generate:
      timeout: 300000  # 5分钟超时
      retry-count: 3
  
  # RAG系统配置
  rag:
    top-k: 5
    similarity-threshold: 0.7
  
  # 追读力系统配置
  rhythm:
    analysis:
      window-size: 5
      cool-point-threshold: 0.6
  
  # 防幻觉配置
  anti-hallucination:
    consistency-check: true
    setting-constraint: true